# Local:       docker compose up --build            → http://localhost:3000
# Production:  docker compose --profile proxy up -d --build
#              (Caddy terminates TLS for SITE_DOMAIN and proxies to the app)

services:
  web:
    build:
      context: .
      args:
        # Public, build-time values — baked into the client bundle.
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://modelstrike.ai}
        NEXT_PUBLIC_CONTACT_EMAIL: ${NEXT_PUBLIC_CONTACT_EMAIL:-}
        NEXT_PUBLIC_CAL_LINK: ${NEXT_PUBLIC_CAL_LINK:-}
        # The CSP is fixed at build time, so its extra origins are build args too.
        CSP_SCRIPT_SRC: ${CSP_SCRIPT_SRC:-}
        CSP_CONNECT_SRC: ${CSP_CONNECT_SRC:-}
        CSP_FRAME_SRC: ${CSP_FRAME_SRC:-}
    image: modelstrike-web
    restart: unless-stopped
    # Runtime secrets (CONTACT_*, RESEND_API_KEY). Never passed as build args.
    env_file:
      - path: .env
        required: false
    # Published on all interfaces. Visitors who hit :3000 directly bypass Caddy,
    # so they can spoof X-Forwarded-For and dodge the contact-form rate limit —
    # firewall 3000 in production if you don't need it reachable.
    ports:
      - "3000:3000"
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache:mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/robots.txt"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  caddy:
    image: caddy:2.10-alpine
    profiles: [proxy]
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-modelstrike.ai}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
